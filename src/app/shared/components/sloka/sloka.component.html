<div class="text-container" [class.full-screen]="fullScreen">
  <div class="quote-mark" [class.text--visible]="isVisible" [class.text--exiting]="isExiting">“</div>
  <div class="text"
       [class.text--visible]="isVisible"
       [class.text--exiting]="isExiting"
       [class.text--compact]="displayedText.length > 275"
       [class.text--clickable]="hasSanskritText"
       (click)="openSanskritPopup()">
    {{ displayedText }}”
  </div>
  <img src="assets/images/decoration_icon_main.png" alt="Line" class="decoration-main"
       [class.text--visible]="isVisible" [class.text--exiting]="isExiting"/>
  <div class="text-index" [class.text--visible]="isVisible" [class.text--exiting]="isExiting">
    Bhagavad-gítá {{ displayedSloka?.chapter }}.{{ displayedSloka?.index }}
  </div>
</div>

<app-modal
  [isOpen]="isSanskritPopupOpen"
  [title]="sanskritDialogTitle"
  [text]="sanskritText"
  (close)="closeSanskritPopup()">
</app-modal>
