<div class="container">
  @if (!appStateService.hideMainMenu() && router.url !== '/') {
    <div class="top-buttons">
      <button routerLink="/guidance" routerLinkActive="is-selected" [routerLinkActiveOptions]="{ exact: true }" type="button">Guidance</button>
      <button routerLink="/mind" routerLinkActive="is-selected" [routerLinkActiveOptions]="{ exact: true }" type="button">State of Mind</button>
      <button routerLink="/library" routerLinkActive="is-selected" [routerLinkActiveOptions]="{ exact: true }" type="button">Verse Library</button>
      <button routerLink="/" routerLinkActive="is-selected" [routerLinkActiveOptions]="{ exact: true }" type="button">Practice</button>
    </div>
  } @else if (router.url === '/') {
    <h1>Daily Gita</h1>
    <div class="content">
      <button routerLink="/guidance" type="button">Guidance</button>
      <button routerLink="/mind" type="button">State of Mind</button>
      <button routerLink="/library" type="button">Verse Library</button>
      <button [disabled]="true" routerLink="/practice" type="button">Practice</button>
    </div>
  }
  <router-outlet></router-outlet>
</div>
