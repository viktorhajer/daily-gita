<div class="content">
  @if (!category) {
    <div class="categories-grid">
      @for (categoryItem of slokaService.categories; track categoryItem) {
        <button
          (click)="setCategory(categoryItem)"
          [class.is-selected]="category === categoryItem"
          class="category-button">
          {{ categoryItem }}
        </button>
      }
    </div>
  } @else {
    <app-sloka [text]="text" [sloka]="sloka" (click)="showNext()"></app-sloka>

    <div class="footer">
      <button (click)="showPrevious()" class="html-icon" [disabled]="filteredTexts.length < 2" aria-label="Previous" title="Previous">
        «
      </button>
      <button (click)="showCategorySelector()" class="icon-size" [disabled]="false" aria-label="Change Category" title="Change Category">
        &#9776;
      </button>
      <button (click)="favouriteService.toggle(sloka)" class="html-icon" [disabled]="slokaService.texts.length < 2">
        @if (sloka && favouriteService.isFavourite(sloka)) { &#9733; } @else { &#9734; }
      </button>
      <button (click)="showNext()" class="html-icon" [disabled]="filteredTexts.length < 2" aria-label="Next" title="Next">
        »
      </button>
    </div>
  }
</div>
