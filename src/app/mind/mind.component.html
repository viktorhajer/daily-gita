<div class="content">

  <div class="categories-nav">
    <button class="scroll-arrow" (click)="scrollCategories(-1)" [disabled]="!canScrollLeft">&#8249;</button>
    <div class="categories-scroll" #categoriesScroll (scroll)="updateScrollState()">
      @for (categoryItem of slokaService.categories; track categoryItem) {
        <button
          (click)="setCategory(categoryItem)"
          [class.is-selected]="category === categoryItem"
          class="secondary">
          {{ categoryItem }}
        </button>
      }
    </div>
    <button class="scroll-arrow" (click)="scrollCategories(1)" [disabled]="!canScrollRight">&#8250;</button>
  </div>

  <app-sloka [text]="text" [sloka]="sloka" (click)="showNext()"></app-sloka>

  <div class="footer">
    <button (click)="showPrevious()" class="fixed-size" [disabled]="filteredTexts.length < 2">
      Previous
    </button>
    <button (click)="showNext()" class="fixed-size" [disabled]="filteredTexts.length < 2">
      Next
    </button>
  </div>
</div>
