<div class="content">
  <app-sloka [text]="text" [sloka]="texts[currentIndex] ?? null" (click)="showNext()"></app-sloka>
  <div class="footer">
    @if (!isAutoRotating) {
      <button (click)="showPrevious()" class="icon-size" [disabled]="false" aria-label="Previous" title="Previous">
        &#9664;
      </button>
      <button (click)="startAutoRotate()" class="auto-play-button is-selected" [disabled]="texts.length < 2" aria-label="Auto-play" title="Auto-play">
        Auto-play
      </button>
      <button (click)="showNext()" class="icon-size" [disabled]="false">
        &#9654;
      </button>
    }
  </div>

  @if (isAutoRotating) {
    <button (click)="stopAutoRotate()" class="stop-button" type="button">
      &#9209;
    </button>
  }
</div>
