<div class="content">
  <app-sloka [text]="text" [index]="texts[currentIndex].index" (click)="showNext()"></app-sloka>
  <div class="footer">
    @if (!isAutoRotating) {
      <button (click)="showPrevious()" class="fixed-size" [disabled]="false">
        Previous
      </button>
      <button (click)="showNext()" class="fixed-size" [disabled]="false">
        Next
      </button>
      <button (click)="startAutoRotate()" class="fixed-size" [disabled]="texts.length < 2">
        Start
      </button>
    }
  </div>

  @if (isAutoRotating) {
    <button (click)="stopAutoRotate()" class="stop-button" type="button">
      &#9209;
    </button>
  }
</div>
