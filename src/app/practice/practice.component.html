<div class="practice-page">
  <section class="practice-card" *ngIf="verse">
	<header class="practice-header">
	  <h1 class="practice-title">Bhagavad-gítá {{ verse.chapter }}.{{ verse.index }}</h1>
	</header>

	<div class="verse" aria-live="polite">
    “<ng-container *ngFor="let token of verseTokens; trackBy: trackByIndex">
		<span *ngIf="token.kind === 'space'" class="verse-space">{{ token.text }}</span>

		<span *ngIf="token.kind === 'text'" class="verse-word">{{ token.text }}</span>

		<ng-container *ngIf="token.kind === 'blank' && blankState(token.blankIndex) as blank">
		  <span
			class="verse-blank"
			[class.verse-blank--active]="isBlankActive(token.blankIndex ?? -1)"
			[class.verse-blank--revealed]="shouldRevealBlank(token.blankIndex)"
			[class.verse-blank--correct]="blank.status === 'correct'"
			[class.verse-blank--incorrect]="blank.status === 'incorrect'"
			[style.min-width.ch]="getBlankWidth(token.text)"
		  >
			<ng-container [ngSwitch]="blank.status">
			  <ng-container *ngSwitchCase="'pending'">
				  <span *ngIf="shouldRevealBlank(token.blankIndex); else hiddenBlank" class="blank-result blank-result--revealed">
					{{ blank.displayText }}
				</span>

				<ng-template #hiddenBlank>
				  <span class="blank-placeholder">&nbsp;</span>
				</ng-template>
			  </ng-container>

			  <span *ngSwitchCase="'correct'" class="blank-result blank-result--correct">
				{{ blank.userAnswer }}
			  </span>

			  <span *ngSwitchCase="'incorrect'" class="blank-result blank-result--incorrect">
				<span class="blank-user">{{ blank.userAnswer }}</span>
				<span class="blank-correction">{{ blank.displayText }}</span>
			  </span>
			</ng-container>
		  </span>
		</ng-container>
	  </ng-container>”
	</div>

	<form class="answer-panel" *ngIf="!isCompleted; else completedState" (ngSubmit)="submitAnswer()">
	  <div class="answer-label-row">
	    <label class="answer-label" for="practice-answer">
	      Add meg a hiányzó szót.
	    </label>
	    <span class="answer-help-button" (click)="openInfoModal()">
	      ?
	    </span>
	  </div>

	  <div class="answer-row">
		<input
		  id="practice-answer"
		  name="practiceAnswer"
		  class="answer-input"
		  [(ngModel)]="currentAnswer"
		  [disabled]="!hasActiveBlank"
		/>
      <button class="answer-button is-selected" type="submit" [disabled]="!canSubmit()">
		    {{ submitButtonLabel }}
      </button>
      <button
        class="reveal-button"
        type="button"
        [disabled]="!hasPendingBlanks"
        (pointerdown)="startRevealPendingBlanks()"
        (pointerup)="stopRevealPendingBlanks()"
        (pointerleave)="stopRevealPendingBlanks()"
        (pointercancel)="stopRevealPendingBlanks()"
        (blur)="stopRevealPendingBlanks()"
        (keydown.space)="startRevealPendingBlanks()"
        (keyup.space)="stopRevealPendingBlanks()"
        (keydown.enter)="startRevealPendingBlanks()"
        (keyup.enter)="stopRevealPendingBlanks()"
      >
		Felfedés
      </button>
      <button class="restart-button" type="button" (click)="startNewRound()">Új</button>
	  </div>
	</form>

	<ng-template #completedState>
	  <div class="answer-panel answer-panel--completed">
		<button type="button" class="restart-button" (click)="restartPractice()">Újra</button>
		<button type="button" class="restart-button" (click)="startNewRound()">Új</button>
	  </div>
	</ng-template>

	<app-modal
	  [isOpen]="isInfoModalOpen"
	  [title]="infoModalTitle"
	  [text]="infoModalText"
	  (close)="closeInfoModal()"
	></app-modal>
  </section>
</div>
